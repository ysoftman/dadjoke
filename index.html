    <header class="topbar">
      <div class="container">
        <div class="topbar-row">
          <h1>윤준영의 아재개그</h1>
          <nav class="actions" aria-label="도구">
            <button
              type="button"
              class="icon-btn shuffle-btn"
              aria-label="카드 순서 섞기"
              title="섞기"
            >
              <svg class="ico"><use href="#i-shuffle" /></svg>
            </button>
            <button
              type="button"
              class="icon-btn random-btn"
              id="random-btn"
              aria-label="랜덤 조크 보기"
              title="랜덤"
            >
              <svg class="ico"><use href="#i-dice-five" /></svg>
            </button>
            <button
              type="button"
              class="icon-btn dark-toggle-btn"
              id="dark-toggle"
              aria-label="다크모드 전환"
              title="다크모드"
            >
              <svg class="ico i-moon"><use href="#i-moon" /></svg>
              <svg class="ico i-sun"><use href="#i-sun" /></svg>
            </button>
          </nav>
        </div>

        <div class="toolbar">
          <div class="search-box">
            <svg class="ico search-icon">
              <use href="#i-magnifying-glass" />
            </svg>
            <input
              type="search"
              id="search"
              placeholder="검색"
              aria-label="조크 검색"
            />
            <span class="search-count" id="search-count"></span>
            <button
              type="button"
              class="search-clear"
              id="search-clear"
              aria-label="검색어 지우기"
              hidden
            >
              <svg class="ico"><use href="#i-x" /></svg>
            </button>
          </div>
          <button
            type="button"
            class="icon-btn reveal-toggle-btn"
            id="reveal-toggle"
            aria-pressed="false"
            aria-label="정답 항상 보기"
            title="정답 항상 보기"
          >
            <svg class="ico reveal-icon-off"><use href="#i-eye-slash" /></svg>
            <svg class="ico reveal-icon-on"><use href="#i-eye" /></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <p class="intro" id="intro">질문을 누르면 정답이 보입니다.</p>
      <div class="cards" id="cards" aria-live="polite"></div>
    </main>
